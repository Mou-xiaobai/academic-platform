<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学术研究平台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">🎓 学术研究平台<br><span style="font-size:11px;font-weight:400;color:#8a93a6">文献 · 综述 · 翻译 · Zotero</span></div>
    <nav id="nav">
      <button data-view="dash" class="active">📊 总览看板</button>

      <button data-view="export">📤 导出</button>

    <div class="side-foot">
      <div id="save-state">就绪</div>
    </div>
  </aside>
  <main id="main">
    <div id="ptabs"></div>
    <div id="mcontent"></div>

<script src="/static/app.js"></script>
<div id="modal-bg"><div id="modal"></div></div>
